name: Feature request
description: Propose a new feature or improvement.
title: "feat: "
labels: []
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve? Who does it help?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should change? API sketch if applicable.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches and why not.
  - type: dropdown
    id: scope
    attributes:
      label: Likely scope
      multiple: false
      options:
        - Chat layer (engine/chat)
        - Runtime layer (engine/runtime)
        - Models / loaders
        - Tokenizer
        - Training
        - Docs / CI / tooling
        - Unsure
