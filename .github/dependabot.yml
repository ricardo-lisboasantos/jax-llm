version: 2
updates:
  # Keep pinned GitHub Actions current (grouped to a single weekly PR).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    groups:
      actions:
        patterns: ["*"]
    labels:
      - chore
    commit-message:
      prefix: chore
      include: scope
