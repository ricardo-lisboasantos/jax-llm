name: CI

# Runs on every change: any push and any pull request.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup Deno
        id: setup-deno
        uses: denoland/setup-deno@v2
        continue-on-error: true
        with:
          deno-version: v2.x
      - name: Setup Deno (fallback installer)
        # setup-deno downloads from GitHub Releases, which occasionally 504s.
        # The official installer uses a different CDN (dl.deno.land), so it
        # survives those outages.
        if: steps.setup-deno.outcome == 'failure'
        run: |
          curl -fsSL https://deno.land/install.sh | sh
          echo "$HOME/.deno/bin" >> "$GITHUB_PATH"
          deno --version
      - name: Format check
        run: deno fmt --check
      - name: Lint
        run: deno lint
      - name: Type check
        run: deno check --all
      - name: Test
        run: deno test -A

  publish:
    # Publishes to JSR only when every verify step passed, and only for
    # pushes to main (never for pull requests).
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC trusted publishing with JSR.
    steps:
      - uses: actions/checkout@v6
      - run: npx jsr publish
