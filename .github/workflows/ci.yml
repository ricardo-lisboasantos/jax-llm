name: CI

# Continuous integration: fast, transparent verification on every change.
# Publishing happens only via the release PR flow (release.yml proposes,
# release-publish.yml ships on merge). This workflow never publishes.

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cost-guard:
    name: Cost guard
    # Cost policy: standard `ubuntu-latest` runners only — no large runners,
    # no matrices, no self-hosted GPU. Public repos get unlimited standard
    # minutes; anything else bills. This job fails the gate if any workflow
    # file references a different runner.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Assert standard runners only
        # The `:[0-9]+:` filter matches real `runs-on:` YAML keys only, not
        # these script lines mentioning the pattern.
        run: |
          VIOLATIONS="$(grep -rHn 'runs-on:' .github/workflows/ | grep -E ':[0-9]+: +runs-on:' | grep -vE 'runs-on: ubuntu-latest[[:space:]]*(#|$)' || true)"
          if [[ -n "$VIOLATIONS" ]]; then
            echo "::error::non-standard runner detected (large runners bill money):"
            echo "$VIOLATIONS"
            exit 1
          fi
          echo "✅ All workflow jobs use standard runners only."
          grep -rHn 'runs-on:' .github/workflows/ | grep -E ':[0-9]+: +runs-on:' | sort -t: -k3 | uniq -c -f2
  conventional:
    name: Conventional commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Lint PR title
        uses: amannn/action-semantic-pull-request@v5
        with:
          types: |
            feat
            fix
            perf
            docs
            test
            refactor
            style
            chore
            ci
            build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  verify:
    name: Verify
    # The full quality gate lives in .github/actions/verify (single
    # definition shared with the release workflows). This job runs it on
    # the pushed/PR tree, including audit, tests with coverage, and a JSR
    # dry-run so packaging breakages surface on PRs, not at release time.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Verify
        uses: ./.github/actions/verify
        with:
          coverage-name: coverage-${{ github.sha }}

  gate:
    name: CI gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # `conventional` only runs on pull_request (skipped on push — treated
    # as pass). Everything else runs on all events.
    needs: [conventional, cost-guard, verify]
    if: always()
    steps:
      - name: Gate summary
        run: |
          echo "## CI gate" >> "$GITHUB_STEP_SUMMARY"
          echo "- conventional: ${{ needs.conventional.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- cost-guard: ${{ needs.cost-guard.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- verify: ${{ needs.verify.result }}" >> "$GITHUB_STEP_SUMMARY"
          CONV="${{ needs.conventional.result }}"
          if { [ "$CONV" != "success" ] && [ "$CONV" != "skipped" ]; } || \
             [ "${{ needs.cost-guard.result }}" != "success" ] || \
             [ "${{ needs.verify.result }}" != "success" ]; then
            echo "❌ CI gate failed." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "✅ All checks passed. Promote dev → main via PR, then release via Actions → Release → Run workflow (from main)." >> "$GITHUB_STEP_SUMMARY"
