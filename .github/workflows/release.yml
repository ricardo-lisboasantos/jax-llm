name: Release

# Cost policy: standard `ubuntu-latest` runners only (see cost-guard in
# ci.yml). Never use large runners, matrices, or self-hosted GPU runners.
#
# Release proposal ("Release button"):
#   GitHub → Actions → Release → **Use workflow from: main** → Run workflow
#   → pick a version bump. Runs from main ONLY (production branch);
#   development happens on dev and reaches main via pull request.
#
# What it does, in order (every step is visible in the run Summary):
#   1. plan    — resolve previous tag + next version, gather commits since
#                last release, render changelog, upload NOTES.md + manifest.
#   2. verify  — full gate (fmt, lint, types, docs, tests, JSR dry-run).
#   3. propose — bump deno.json, prepend CHANGELOG.md, write
#                docs/releases/vX.Y.Z.md, and open a `release/vX.Y.Z` pull
#                request to main (label: release). Nothing is published yet.
#
# Publishing happens in release-publish.yml when that PR merges: tag + JSR
# publish (OIDC, no token) + GitHub Release. This keeps main fully
# branch-protected — no direct pushes, not even from automation.
#
# Standardization:
# - Version source of truth is `deno.json`. Tags are `vX.Y.Z` and always match.
# - Changelog entries come from conventional commits via
#   scripts/generate_changelog.ts (same script runs locally for previews).
# - `dry_run: true` runs plan + verify + stamping and stops before opening
#   the PR — use it to review notes before proposing.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump (explicit overrides it)"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major
          - explicit
      version:
        description: "Explicit version (e.g. 0.5.0) — required when bump=explicit"
        required: false
        default: ""
      dry_run:
        description: "Preview only (no release PR opened)"
        required: false
        default: false
        type: boolean
      prerelease:
        description: "Mark the eventual GitHub Release as a pre-release"
        required: false
        default: false
        type: boolean

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Least privilege: plan/verify only read; propose gets write scopes below.
permissions:
  contents: read

jobs:
  plan:
    name: Plan release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      previous_tag: ${{ steps.resolve.outputs.previous_tag }}
      dry_run: ${{ steps.resolve.outputs.dry_run }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
    steps:
      - name: Guard release source
        run: |
          if [[ "${{ github.ref }}" != "refs/heads/main" ]]; then
            echo "::error::Release proposals must run from main (Use workflow from: main). Current: ${{ github.ref }}"
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          # Manual runs execute against main even if triggered from another
          # branch selector.
          ref: main

      - name: Setup Deno
        id: setup-deno
        uses: denoland/setup-deno@v2
        continue-on-error: true
        with:
          deno-version: v2.x

      - name: Setup Deno (fallback installer)
        if: steps.setup-deno.outcome == 'failure'
        run: |
          curl -fsSL https://deno.land/install.sh | sh
          echo "$HOME/.deno/bin" >> "$GITHUB_PATH"
          deno --version

      - name: Resolve version + generate notes
        id: resolve
        run: |
          set -euo pipefail
          BUMP="${{ inputs.bump }}"
          EXPLICIT="${{ inputs.version }}"
          CURRENT="$(deno eval 'console.log(JSON.parse(await Deno.readTextFile("deno.json")).version)')"
          if [[ "$BUMP" == "explicit" ]]; then
            if [[ -z "$EXPLICIT" ]]; then echo "::error::bump=explicit requires the version input"; exit 1; fi
            VERSION="${EXPLICIT#v}"
          else
            VERSION="$(deno run -A scripts/generate_changelog.ts --bump "$BUMP" --print-version)"
            if [[ -z "$VERSION" ]]; then echo "::error::could not resolve bumped version"; exit 1; fi
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::resolved version is not semver X.Y.Z: $VERSION"
            exit 1
          fi
          PREV_TAG="$(git tag --list 'v*' --sort=-v:refname | head -n 1 || true)"
          DRY_RUN="${{ inputs.dry_run }}"
          PRERELEASE="${{ inputs.prerelease }}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "previous_tag=$PREV_TAG" >> "$GITHUB_OUTPUT"
          echo "dry_run=$DRY_RUN" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "Resolved version: v$VERSION (previous: ${PREV_TAG:-(none)}, dry_run: $DRY_RUN)"

          FROM_ARG=()
          if [[ -n "$PREV_TAG" ]]; then FROM_ARG=(--from "$PREV_TAG"); fi
          deno run -A scripts/generate_changelog.ts "${FROM_ARG[@]}" --to HEAD \
            --version "$VERSION" --out NOTES.md --manifest release-manifest.json
          echo "### Release plan" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Version:** \`v$VERSION\` (deno.json currently \`$(deno eval 'console.log(JSON.parse(await Deno.readTextFile("deno.json")).version)')\`)" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Previous tag:** \`${PREV_TAG:-(none — full history)}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Dry run:** \`$DRY_RUN\` · **Pre-release:** \`$PRERELEASE\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          cat NOTES.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload plan artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-plan-v${{ steps.resolve.outputs.version }}
          path: |
            NOTES.md
            release-manifest.json
          retention-days: 90

  verify:
    name: Verify
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          # Verify exactly what would ship: main.
          ref: main
      - name: Verify
        uses: ./.github/actions/verify

  propose:
    name: Propose v${{ needs.plan.outputs.version }}
    needs: [plan, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: main

      - name: Setup Deno
        id: setup-deno
        uses: denoland/setup-deno@v2
        continue-on-error: true
        with:
          deno-version: v2.x

      - name: Setup Deno (fallback installer)
        if: steps.setup-deno.outcome == 'failure'
        run: |
          curl -fsSL https://deno.land/install.sh | sh
          echo "$HOME/.deno/bin" >> "$GITHUB_PATH"
          deno --version

      - name: Stamp version + changelog
        run: |
          set -euo pipefail
          VERSION="${{ needs.plan.outputs.version }}"
          PREV_TAG="${{ needs.plan.outputs.previous_tag }}"
          # Sync deno.json version (source of truth for JSR).
          deno eval "
            const path = 'deno.json';
            const json = JSON.parse(await Deno.readTextFile(path));
            json.version = '$VERSION';
            await Deno.writeTextFile(path, JSON.stringify(json, null, 2) + '\n');
          "
          echo "deno.json → $VERSION"
          FROM_ARG=()
          if [[ -n "$PREV_TAG" ]]; then FROM_ARG=(--from "$PREV_TAG"); fi
          deno run -A scripts/generate_changelog.ts "${FROM_ARG[@]}" --to HEAD \
            --version "$VERSION" --out NOTES.md --manifest release-manifest.json \
            --write-changelog --write-docs
          # Generated files must satisfy `deno fmt --check` (markdown line
          # wrapping, JSON trailing newline) before the re-verify below.
          deno fmt NOTES.md release-manifest.json CHANGELOG.md "docs/releases/v$VERSION.md"
          echo "### Release contents (v$VERSION)" >> "$GITHUB_STEP_SUMMARY"
          cat NOTES.md >> "$GITHUB_STEP_SUMMARY"

      - name: Re-verify stamped tree
        # Tests already ran on this tree in `verify`; the stamp only touches
        # version/changelog files, so re-run everything except the suite.
        # --allow-dirty: stamp files are intentionally uncommitted here.
        uses: ./.github/actions/verify
        with:
          run-tests: "false"
          jsr-allow-dirty: "true"

      - name: Open release PR
        if: needs.plan.outputs.dry_run != 'true'
        run: |
          set -euo pipefail
          VERSION="${{ needs.plan.outputs.version }}"
          BRANCH="release/v$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add deno.json CHANGELOG.md "docs/releases/v$VERSION.md"
          git commit -m "chore(release): v$VERSION" || echo "nothing to commit"
          git push --force origin "$BRANCH"
          if gh pr view "$BRANCH" --json number >/dev/null 2>&1; then
            gh pr edit "$BRANCH" --title "chore(release): v$VERSION" --body-file NOTES.md --add-label release
            if [[ "${{ needs.plan.outputs.prerelease }}" == "true" ]]; then
              gh pr edit "$BRANCH" --add-label pre-release
            fi
            echo "Updated existing PR for $BRANCH"
          else
            CREATE_ARGS=(--head "$BRANCH" --base main --title "chore(release): v$VERSION" --body-file NOTES.md --label release)
            if [[ "${{ needs.plan.outputs.prerelease }}" == "true" ]]; then
              CREATE_ARGS+=(--label pre-release)
            fi
            gh pr create "${CREATE_ARGS[@]}"
            echo "Opened PR for $BRANCH"
          fi
          echo "### Proposal" >> "$GITHUB_STEP_SUMMARY"
          echo "Review and merge https://github.com/${{ github.repository }}/compare/main...$BRANCH — merging publishes (see release-publish)." >> "$GITHUB_STEP_SUMMARY"

      - name: Dry-run summary
        if: needs.plan.outputs.dry_run == 'true'
        run: |
          echo "### Dry run — no release PR opened" >> "$GITHUB_STEP_SUMMARY"
          echo "Review NOTES.md above, then re-run with dry_run=false to propose v${{ needs.plan.outputs.version }}." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-v${{ needs.plan.outputs.version }}
          path: |
            NOTES.md
            release-manifest.json
            CHANGELOG.md
            docs/releases/v${{ needs.plan.outputs.version }}.md
          if-no-files-found: warn
          retention-days: 90

      - name: Done
        if: needs.plan.outputs.dry_run != 'true'
        run: |
          echo "### Result" >> "$GITHUB_STEP_SUMMARY"
          echo "- Release PR must be merged to publish; CI runs the full gate on it." >> "$GITHUB_STEP_SUMMARY"
          echo "- On merge, release-publish tags v${{ needs.plan.outputs.version }}, publishes to JSR, and creates the GitHub Release." >> "$GITHUB_STEP_SUMMARY"
