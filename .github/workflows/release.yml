name: Release

# One-click release ("Release button"):
#   GitHub → Actions → Release → **Use workflow from: main** → Run workflow
#   → pick a version bump. Releases run from main ONLY (production branch);
#   development happens on dev and reaches main via pull request.
#
# What it does, in order (every step is visible in the run Summary):
#   1. plan    — resolve previous tag + next version, gather commits since
#                last release, render changelog, upload NOTES.md + manifest.
#   2. verify  — full gate (fmt, lint, types, docs, tests, JSR dry-run).
#   3. publish — bump deno.json, prepend CHANGELOG.md, write
#                docs/releases/vX.Y.Z.md, publish to JSR (OIDC, no token),
#                commit + tag + push, create the GitHub Release with artifacts.
#
# Standardization:
# - Version source of truth is `deno.json`. Tags are `vX.Y.Z` and always match.
# - Changelog entries come from conventional commits via
#   scripts/generate_changelog.ts (same script runs locally for previews).
# - `dry_run: true` runs everything except the JSR publish, tag push, and
#   GitHub Release — use it to review notes before shipping.
#
# Tag-driven releases are also supported: pushing a `v*.*.*` tag runs the same
# pipeline with that exact version (no bump commit is pushed in that case).

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump (explicit overrides it)"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major
          - explicit
      version:
        description: "Explicit version (e.g. 0.5.0) — required when bump=explicit"
        required: false
        default: ""
      dry_run:
        description: "Preview only (no JSR publish, tag, or GitHub Release)"
        required: false
        default: false
        type: boolean
      prerelease:
        description: "Mark the GitHub Release as a pre-release"
        required: false
        default: false
        type: boolean
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  plan:
    name: Plan release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      previous_tag: ${{ steps.resolve.outputs.previous_tag }}
      dry_run: ${{ steps.resolve.outputs.dry_run }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
    steps:
      - name: Guard release source
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then exit 0; fi
          if [[ "${{ github.ref }}" != "refs/heads/main" ]]; then
            echo "::error::Releases must run from main (Use workflow from: main). Current: ${{ github.ref }}"
            exit 1
          fi

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
          # Manual runs execute against main even if triggered from another
          # branch selector; tag pushes check out the tag itself.
          ref: ${{ github.ref_type == 'tag' && github.ref || 'main' }}

      - name: Setup Deno
        id: setup-deno
        uses: denoland/setup-deno@v2
        continue-on-error: true
        with:
          deno-version: v2.x

      - name: Setup Deno (fallback installer)
        if: steps.setup-deno.outcome == 'failure'
        run: |
          curl -fsSL https://deno.land/install.sh | sh
          echo "$HOME/.deno/bin" >> "$GITHUB_PATH"
          deno --version

      - name: Resolve version + generate notes
        id: resolve
        run: |
          set -euo pipefail
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            PREV_TAG="$(git tag --list 'v*' --sort=-v:refname | grep -v "^${GITHUB_REF_NAME}$" | head -n 1 || true)"
            DRY_RUN="false"
            PRERELEASE="false"
          else
            BUMP="${{ inputs.bump }}"
            EXPLICIT="${{ inputs.version }}"
            CURRENT="$(deno eval 'console.log(JSON.parse(await Deno.readTextFile("deno.json")).version)')"
            if [[ "$BUMP" == "explicit" ]]; then
              if [[ -z "$EXPLICIT" ]]; then echo "::error::bump=explicit requires the version input"; exit 1; fi
              VERSION="${EXPLICIT#v}"
            else
              VERSION="$(deno run -A scripts/generate_changelog.ts --bump "$BUMP" 2>/dev/null | head -1 | sed 's/^## v//; s/ —.*//')"
              if [[ -z "$VERSION" ]]; then echo "::error::could not resolve bumped version"; exit 1; fi
            fi
            PREV_TAG="$(git tag --list 'v*' --sort=-v:refname | head -n 1 || true)"
            DRY_RUN="${{ inputs.dry_run }}"
            PRERELEASE="${{ inputs.prerelease }}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "previous_tag=$PREV_TAG" >> "$GITHUB_OUTPUT"
          echo "dry_run=$DRY_RUN" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "Resolved version: v$VERSION (previous: ${PREV_TAG:-(none)}, dry_run: $DRY_RUN)"

          FROM_ARG=()
          if [[ -n "$PREV_TAG" ]]; then FROM_ARG=(--from "$PREV_TAG"); fi
          deno run -A scripts/generate_changelog.ts "${FROM_ARG[@]}" --to HEAD \
            --version "$VERSION" --out NOTES.md --manifest release-manifest.json
          echo "### Release plan" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Version:** \`v$VERSION\` (deno.json currently \`$(deno eval 'console.log(JSON.parse(await Deno.readTextFile("deno.json")).version)')\`)" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Previous tag:** \`${PREV_TAG:-(none — full history)}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Dry run:** \`$DRY_RUN\` · **Pre-release:** \`$PRERELEASE\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          cat NOTES.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload plan artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-plan-v${{ steps.resolve.outputs.version }}
          path: |
            NOTES.md
            release-manifest.json
          retention-days: 90

  verify:
    name: Verify
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          # Verify exactly what would ship: main on manual runs, the tag itself
          # on tag pushes.
          ref: ${{ github.ref_type == 'tag' && github.ref || 'main' }}

      - name: Setup Deno
        id: setup-deno
        uses: denoland/setup-deno@v2
        continue-on-error: true
        with:
          deno-version: v2.x

      - name: Setup Deno (fallback installer)
        if: steps.setup-deno.outcome == 'failure'
        run: |
          curl -fsSL https://deno.land/install.sh | sh
          echo "$HOME/.deno/bin" >> "$GITHUB_PATH"
          deno --version

      - name: Format check
        run: deno fmt --check

      - name: Lint
        run: deno lint

      - name: Type check
        run: deno check --all

      - name: JSDoc coverage
        # 0 missing-jsdoc allowed; private-type-ref (slow-types) notices
        # from JAX-JS dependency types are tracked separately.
        run: |
          OUT="$(deno doc --lint mod.ts 2>&1)" || true
          echo "$OUT"
          if echo "$OUT" | grep -q "error\[missing-jsdoc\]"; then
            echo "::error::missing JSDoc (0 allowed)"
            exit 1
          fi

      - name: Tests
        run: deno test -A

      - name: JSR dry-run
        run: npx jsr publish --dry-run

  publish:
    name: Publish v${{ needs.plan.outputs.version }}
    needs: [plan, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
          # On tag pushes, check out the tag; on manual runs, stay on main.
          ref: ${{ github.ref_type == 'tag' && github.ref || 'main' }}

      - name: Setup Deno
        id: setup-deno
        uses: denoland/setup-deno@v2
        continue-on-error: true
        with:
          deno-version: v2.x

      - name: Setup Deno (fallback installer)
        if: steps.setup-deno.outcome == 'failure'
        run: |
          curl -fsSL https://deno.land/install.sh | sh
          echo "$HOME/.deno/bin" >> "$GITHUB_PATH"
          deno --version

      - name: Stamp version + changelog
        run: |
          set -euo pipefail
          VERSION="${{ needs.plan.outputs.version }}"
          PREV_TAG="${{ needs.plan.outputs.previous_tag }}"
          # Sync deno.json version (source of truth for JSR).
          deno eval "
            const path = 'deno.json';
            const json = JSON.parse(await Deno.readTextFile(path));
            json.version = '$VERSION';
            await Deno.writeTextFile(path, JSON.stringify(json, null, 2) + '\n');
          "
          echo "deno.json → $VERSION"
          FROM_ARG=()
          if [[ -n "$PREV_TAG" ]]; then FROM_ARG=(--from "$PREV_TAG"); fi
          deno run -A scripts/generate_changelog.ts "${FROM_ARG[@]}" --to HEAD \
            --version "$VERSION" --out NOTES.md --manifest release-manifest.json \
            --write-changelog --write-docs
          echo "### Release contents (v$VERSION)" >> "$GITHUB_STEP_SUMMARY"
          cat NOTES.md >> "$GITHUB_STEP_SUMMARY"

      - name: Re-verify stamped tree
        run: |
          deno fmt --check
          deno lint
          deno check --all
          OUT="$(deno doc --lint mod.ts 2>&1)" || true
          echo "$OUT"
          if echo "$OUT" | grep -q "error\[missing-jsdoc\]"; then
            echo "::error::missing JSDoc (0 allowed)"
            exit 1
          fi
          npx jsr publish --dry-run

      - name: Publish to JSR
        if: needs.plan.outputs.dry_run != 'true'
        run: npx jsr publish

      - name: Commit, tag, push (manual runs only)
        if: github.ref_type != 'tag' && needs.plan.outputs.dry_run != 'true'
        run: |
          set -euo pipefail
          VERSION="${{ needs.plan.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add deno.json CHANGELOG.md "docs/releases/v$VERSION.md"
          git commit -m "chore(release): v$VERSION" || echo "nothing to commit"
          git tag -a "v$VERSION" -m "Release v$VERSION" || echo "tag exists"
          git push origin HEAD:main
          git push origin "v$VERSION"

      - name: Create GitHub Release
        if: needs.plan.outputs.dry_run != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.plan.outputs.version }}
          name: v${{ needs.plan.outputs.version }}
          body_path: NOTES.md
          prerelease: ${{ needs.plan.outputs.prerelease == 'true' }}
          files: |
            NOTES.md
            release-manifest.json
            CHANGELOG.md

      - name: Dry-run summary
        if: needs.plan.outputs.dry_run == 'true'
        run: |
          echo "### Dry run — nothing published" >> "$GITHUB_STEP_SUMMARY"
          echo "Review NOTES.md above, then re-run with dry_run=false to ship v${{ needs.plan.outputs.version }}." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-v${{ needs.plan.outputs.version }}
          path: |
            NOTES.md
            release-manifest.json
            CHANGELOG.md
            docs/releases/v${{ needs.plan.outputs.version }}.md
          if-no-files-found: warn
          retention-days: 90

      - name: Done
        run: |
          echo "### Result" >> "$GITHUB_STEP_SUMMARY"
          echo "- JSR: https://jsr.io/@ricardo/jax-llm@${{ needs.plan.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Release: https://github.com/${{ github.repository }}/releases/tag/v${{ needs.plan.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
