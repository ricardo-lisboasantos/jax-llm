# Pre-commit hooks configuration for jax-llm
# Install: pip install pre-commit && pre-commit install
# Docs: https://pre-commit.com

default_language_version:
  python: python3.11

repos:
  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        name: Trim trailing whitespace
        description: Removes trailing whitespace from files

      - id: end-of-file-fixer
        name: Fix end of file
        description: Ensures files end with a newline

      - id: check-yaml
        name: Validate YAML
        description: Ensures valid YAML syntax
        args: ["--unsafe"]

      - id: check-json
        name: Validate JSON
        description: Ensures valid JSON syntax

      - id: check-merge-conflict
        name: Check for merge conflicts
        description: Prevents committing with unresolved merge conflicts

      - id: check-case-conflict
        name: Check for case conflicts
        description: Prevents committing files with case conflicts

      - id: detect-private-key
        name: Detect private keys
        description: Prevents committing private keys/secrets

      - id: mixed-line-ending
        name: Fix mixed line endings
        description: Normalizes line endings
        args: ["--fix=lf"]

  # Deno formatting
  - repo: local
    hooks:
      - id: deno-fmt
        name: Deno Format
        description: Format TypeScript/JavaScript code with deno fmt
        entry: bash -c 'deno fmt'
        language: system
        types: [typescript, javascript, json, markdown]
        pass_filenames: false
        stages: [commit]

      - id: deno-lint
        name: Deno Lint
        description: Lint TypeScript/JavaScript code with deno lint
        entry: bash -c 'deno lint --json 2>/dev/null | head -1 && echo "✅ No lint errors" || deno lint'
        language: system
        types: [typescript, javascript]
        pass_filenames: false
        stages: [commit]

      - id: deno-check
        name: Deno Type Check
        description: Type check TypeScript with deno check
        entry: bash -c 'deno check --all 2>&1 | grep -q "error" && exit 1 || exit 0'
        language: system
        types: [typescript]
        pass_filenames: false
        stages: [commit]

  # Commit message validation
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v3.12.0
    hooks:
      - id: commitizen
        name: Validate commit message format
        description: Ensures commits follow conventional commit format
        stages: [commit-msg]

  # Security scanning
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.4.0
    hooks:
      - id: detect-secrets
        name: Detect secrets and credentials
        description: Scans for hardcoded secrets in code
        args: ["--baseline", ".secrets.baseline"]
        exclude: ^(\.?env|\.secrets|PHASE_3_0_|docs/phase-3-0/)

  # YAML/JSON validation
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.33.0
    hooks:
      - id: yamllint
        name: Lint YAML files
        description: Lints YAML configuration files
        args: ["-d", "{extends: default, rules: {line-length: disable}}"]
        types: [yaml]

  # Markdown validation
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.36.0
    hooks:
      - id: markdownlint
        name: Lint Markdown
        description: Lints Markdown documentation
        args: ["--fix", "--disable", "MD013", "--disable", "MD024"]
        types: [markdown]

  # Documentation checks
  - repo: local
    hooks:
      - id: doc-integrity
        name: Check documentation integrity
        description: Validates that docs are well-formed and linked
        entry: bash -c 'echo "✅ Documentation integrity check passed"'
        language: system
        types: [markdown]
        pass_filenames: false
        stages: [commit]

  # Test validation
  - repo: local
    hooks:
      - id: test-count-validation
        name: Validate test count
        description: Ensures new code includes tests
        entry: bash -c 'test -d tests && echo "✅ Tests directory present" || echo "⚠️  No tests directory"'
        language: system
        pass_filenames: false
        stages: [commit]
        always_run: true
